services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "Tienda"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ecommerce
      DB_USERNAME: ecommerce
      DB_PASSWORD: secret
      SESSION_DRIVER: database
      QUEUE_CONNECTION: sync
      CACHE_STORE: database
      MAIL_MAILER: log
      MERCADOPAGO_SANDBOX: "true"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - storage_data:/var/www/html/storage/app/public

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ecommerce
      MYSQL_USER: ecommerce
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      # Host 3307 to avoid clashing with a MySQL already running locally on
      # 3306 — containers still talk to each other over 3306 internally.
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  storage_data:
